name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y cmake g++ python3

      - name: Build project
        run: |
          mkdir build
          cd build
          cmake ..
          make -j
